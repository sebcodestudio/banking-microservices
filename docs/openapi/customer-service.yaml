openapi: 3.0.3
info:
  title: Customer Service API
  description: >
    Microservicio encargado de administrar la informacion de los clientes
    del banco (personales y empresariales). Sigue el patron database per
    service, usando MongoDB como repositorio exclusivo de este servicio.
  version: 1.0.0
servers:
  - url: http://localhost:8081
    description: Entorno local (directo). Tambien accesible via API Gateway en http://localhost:8080/api/customers/**

tags:
  - name: Customers
    description: Operaciones CRUD sobre el recurso Customer
  - name: Auth
    description: Login y registro de credenciales (Fase 13, Parte III)

paths:
  /api/customers:
    get:
      tags: [Customers]
      operationId: findAllCustomers
      summary: Obtiene todos los clientes registrados
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"
    post:
      tags: [Customers]
      operationId: createCustomer
      summary: Registra un nuevo cliente (personal o empresarial)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "201":
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Datos de la solicitud invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del cliente
        schema:
          type: string
    get:
      tags: [Customers]
      operationId: findCustomerById
      summary: Obtiene un cliente por su identificador
      responses:
        "200":
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "404":
          description: Cliente no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags: [Customers]
      operationId: updateCustomer
      summary: Actualiza los datos de un cliente existente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "200":
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
        "400":
          description: Datos de la solicitud invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Cliente no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      tags: [Customers]
      operationId: deleteCustomer
      summary: Elimina un cliente por su identificador
      responses:
        "204":
          description: Cliente eliminado
        "404":
          description: Cliente no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/customers/{id}/credentials:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del cliente
        schema:
          type: string
    post:
      tags: [Auth]
      operationId: setCustomerCredentials
      summary: Registra o reemplaza las credenciales de un cliente existente (Fase 13)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCredentialsRequest"
      responses:
        "204":
          description: Credenciales registradas
        "404":
          description: Cliente no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: El nombre de usuario ya esta en uso por otro cliente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Autentica con usuario/contrasena y emite un JWT (Fase 13)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          description: Usuario o contrasena invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    CustomerType:
      type: string
      enum: [PERSONAL, BUSINESS]
      description: Tipo de cliente del banco

    CustomerStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
      description: Estado del cliente dentro del sistema

    CustomerProfile:
      type: string
      enum: [STANDARD, VIP, PYME]
      description: >
        Perfil comercial del cliente (Fase 8). VIP solo es valido para
        customerType=PERSONAL; PYME solo es valido para
        customerType=BUSINESS. Determina beneficios y requisitos
        adicionales al abrir ciertas cuentas en account-service (ver su
        contrato OpenAPI).

    CustomerRequest:
      type: object
      description: >
        Payload de creacion/actualizacion. Los campos personales
        (firstName, lastName, birthDate) solo aplican cuando
        customerType es PERSONAL; los campos empresariales
        (businessName, ruc, legalRepresentativeName) solo aplican
        cuando customerType es BUSINESS.
      required:
        - customerType
        - documentNumber
        - email
      properties:
        customerType:
          $ref: "#/components/schemas/CustomerType"
        profile:
          $ref: "#/components/schemas/CustomerProfile"
          default: STANDARD
        documentNumber:
          type: string
          description: Numero de documento de identidad (DNI, carnet de extranjeria, etc.)
          example: "45678912"
        email:
          type: string
          format: email
          example: "cliente@example.com"
        phoneNumber:
          type: string
          example: "+51987654321"
        address:
          type: string
          example: "Av. Siempre Viva 123, Lima"
        status:
          $ref: "#/components/schemas/CustomerStatus"
        firstName:
          type: string
          example: "Juan"
        lastName:
          type: string
          example: "Perez"
        birthDate:
          type: string
          format: date
          example: "1990-05-15"
        businessName:
          type: string
          example: "Comercial Andina S.A.C."
        ruc:
          type: string
          example: "20456789123"
        legalRepresentativeName:
          type: string
          example: "Maria Lopez"
        username:
          type: string
          description: >
            Nombre de usuario para el login (Fase 13). Opcional: sin el,
            el cliente sigue existiendo como registro de negocio pero no
            puede autenticarse. Se registra/reemplaza via
            POST /api/customers/{id}/credentials, no al crear/actualizar
            el cliente.
          example: "jperez"

    Customer:
      allOf:
        - $ref: "#/components/schemas/CustomerRequest"
        - type: object
          properties:
            id:
              type: string
              readOnly: true
              example: "64f1a2b3c4d5e6f7a8b9c0d1"
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true

    SetCredentialsRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: "jperez"
        password:
          type: string
          format: password
          minLength: 8
          example: "Sup3rSecreta"

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: "jperez"
        password:
          type: string
          format: password
          example: "Sup3rSecreta"

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT firmado (HS256); subject = id del cliente, claims customerType y profile
        tokenType:
          type: string
          example: "Bearer"
        expiresInSeconds:
          type: integer
          format: int64
          example: 3600

    ApiError:
      type: object
      description: Detalle de error en formato RFC 7807 (ProblemDetail)
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
