openapi: 3.0.3
info:
  title: Yanki Service API
  description: >
    Monedero movil Yanki (Fase 12, Parte III). No requiere ser cliente del
    banco: el registro solo pide documento de identidad, numero de
    celular, IMEI y correo. Sigue el patron database per service
    (coleccion propia en yanki_db). Toda interaccion con account-service
    (asociar tarjeta de debito, cargar/retirar saldo hacia la cuenta
    vinculada) se hace exclusivamente via los topicos Kafka
    yanki.account.requests/yanki.account.responses, nunca por REST: los 3
    endpoints que dependen de esa integracion responden 202 Accepted de
    inmediato y el resultado se consulta luego con
    GET /api/yanki/operations/{correlationId}.
  version: 1.0.0
servers:
  - url: http://localhost:8084
    description: Entorno local (directo). Tambien accesible via API Gateway en http://localhost:8080/api/yanki/**

tags:
  - name: Wallets
    description: Registro, consulta y transferencias entre monederos
  - name: Operations
    description: Operaciones asincronas (vinculo con tarjeta de debito, carga, retiro)

paths:
  /api/yanki/wallets:
    post:
      tags: [Wallets]
      operationId: registerWallet
      summary: Registra un monedero nuevo; no requiere ser cliente del banco
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YankiWalletRequest"
      responses:
        "201":
          description: Monedero registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YankiWallet"
        "409":
          description: Ya existe un monedero con ese numero de documento o de celular
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/yanki/wallets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Wallets]
      operationId: findWalletById
      summary: Obtiene un monedero por su identificador
      responses:
        "200":
          description: Monedero encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YankiWallet"
        "404":
          description: Monedero no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/yanki/wallets/{id}/movements:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Wallets]
      operationId: getWalletMovements
      summary: Consulta el historial de movimientos del monedero
      responses:
        "200":
          description: Movimientos del monedero, del mas reciente al mas antiguo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YankiTransaction"
        "404":
          description: Monedero no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/yanki/transfers:
    post:
      tags: [Wallets]
      operationId: transferBetweenWallets
      summary: Envia saldo de un monedero a otro, identificados por su numero de celular
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "201":
          description: Transferencia realizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YankiTransferResult"
        "400":
          description: Monto invalido, monederos iguales, o saldo insuficiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No existe un monedero con alguno de los numeros de celular indicados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/yanki/wallets/{id}/link-debit-card:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Operations]
      operationId: linkDebitCard
      summary: Inicia (via Kafka) la asociacion del monedero a una tarjeta de debito de account-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkDebitCardRequest"
      responses:
        "202":
          description: Solicitud aceptada; operacion en estado PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YankiOperation"
        "404":
          description: Monedero no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/yanki/wallets/{id}/load:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Operations]
      operationId: loadWallet
      summary: Inicia (via Kafka) una carga de saldo desde la cuenta principal vinculada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountRequest"
      responses:
        "202":
          description: Solicitud aceptada; operacion en estado PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YankiOperation"
        "400":
          description: Monto invalido o el monedero no tiene una tarjeta de debito vinculada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Monedero no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/yanki/wallets/{id}/withdraw:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Operations]
      operationId: withdrawFromWallet
      summary: Inicia (via Kafka) un retiro de saldo hacia la cuenta principal vinculada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountRequest"
      responses:
        "202":
          description: Solicitud aceptada; operacion en estado PENDING
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YankiOperation"
        "400":
          description: Monto invalido, saldo insuficiente en el monedero, o sin tarjeta vinculada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Monedero no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/yanki/operations/{correlationId}:
    parameters:
      - name: correlationId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Operations]
      operationId: getOperation
      summary: Consulta el estado de una operacion asincrona (link/carga/retiro) iniciada previamente
      responses:
        "200":
          description: Estado actual de la operacion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YankiOperation"
        "404":
          description: No existe una operacion con ese correlationId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

components:
  schemas:
    DocumentType:
      type: string
      enum: [DNI, CEX, PASSPORT]

    YankiWalletStatus:
      type: string
      enum: [ACTIVE, BLOCKED]

    YankiWalletRequest:
      type: object
      required: [documentType, documentNumber, phoneNumber, imei, email]
      properties:
        documentType:
          $ref: "#/components/schemas/DocumentType"
        documentNumber:
          type: string
          example: "45678912"
        phoneNumber:
          type: string
          description: Usado para enviar/recibir pagos
          example: "987654321"
        imei:
          type: string
          example: "123456789012345"
        email:
          type: string
          format: email
          example: "usuario@example.com"

    YankiWallet:
      allOf:
        - $ref: "#/components/schemas/YankiWalletRequest"
        - type: object
          properties:
            id:
              type: string
              readOnly: true
            balance:
              type: number
              format: double
              readOnly: true
              default: 0
            linkedDebitCardId:
              type: string
              readOnly: true
              description: Null hasta que un link-debit-card se confirme por Kafka
            linkedAccountId:
              type: string
              readOnly: true
            status:
              $ref: "#/components/schemas/YankiWalletStatus"
            createdAt:
              type: string
              format: date-time
              readOnly: true
            updatedAt:
              type: string
              format: date-time
              readOnly: true

    TransferRequest:
      type: object
      required: [senderPhone, receiverPhone, amount]
      properties:
        senderPhone:
          type: string
          example: "987654321"
        receiverPhone:
          type: string
          example: "912345678"
        amount:
          type: number
          format: double
          example: 50.00

    YankiTransactionType:
      type: string
      enum: [SEND, RECEIVE, LOAD, WITHDRAW]

    YankiTransaction:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        walletId:
          type: string
        type:
          $ref: "#/components/schemas/YankiTransactionType"
        amount:
          type: number
          format: double
        counterpartyPhone:
          type: string
          description: Solo aplica a SEND/RECEIVE
        movementDate:
          type: string
          format: date-time

    YankiTransferResult:
      type: object
      properties:
        sendTransaction:
          $ref: "#/components/schemas/YankiTransaction"
        receiveTransaction:
          $ref: "#/components/schemas/YankiTransaction"

    LinkDebitCardRequest:
      type: object
      required: [debitCardId]
      properties:
        debitCardId:
          type: string
          description: Id de una tarjeta de debito existente en account-service
          example: "64f1a2b3c4d5e6f7a8b9c0d4"

    AmountRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          example: 50.00

    YankiOperationType:
      type: string
      enum: [LINK_CARD, CREDIT, DEBIT]
      description: >
        CREDIT/DEBIT describen el efecto sobre el MONEDERO, no sobre la
        cuenta: CREDIT (carga) acredita el monedero y debita la cuenta
        vinculada; DEBIT (retiro) debita el monedero y acredita la cuenta.

    YankiOperationStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED]

    YankiOperation:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        correlationId:
          type: string
        walletId:
          type: string
        operationType:
          $ref: "#/components/schemas/YankiOperationType"
        status:
          $ref: "#/components/schemas/YankiOperationStatus"
        errorMessage:
          type: string
          description: Solo presente si status es FAILED

    ApiError:
      type: object
      description: Detalle de error en formato RFC 7807 (ProblemDetail)
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
