server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: localhost
  client:
    # El propio servidor Eureka no necesita registrarse a si mismo ni
    # consultar el registro (es standalone, sin peers).
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Reduce el tiempo de espera de limpieza de instancias caidas, util
    # en un entorno de desarrollo donde los servicios se reinician seguido.
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
