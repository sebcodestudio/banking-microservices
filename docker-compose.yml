version: "3.9"

# Orquesta los 7 microservicios del sistema bancario (Eureka Server,
# API Gateway, Config Server, los 3 microservicios de negocio de Parte I/II
# y yanki-service de Parte III) junto con sus bases de datos MongoDB, el
# broker Kafka (puente asincrono yanki-service <-> account-service, Fase 12)
# y Redis (cache de Customer, Fase 14). Se respeta el patron
# "database per service": cada microservicio con persistencia
# (customer-service, account-service, credit-service, yanki-service) tiene
# su propio contenedor de MongoDB, sin compartir instancia ni coleccion
# con los demas.
#
# Ninguna configuracion de infraestructura queda hardcodeada en el
# codigo de los microservicios: los hosts de Mongo, Kafka, Redis, Eureka y
# customer-service se resuelven mediante el perfil "docker" (archivos
# *-docker.yml servidos por config-server) y
# SPRING_PROFILES_ACTIVE/SPRING_CONFIG_IMPORT inyectados aqui como
# variables de entorno.

services:

  # ---------------- Eureka Server (registro y descubrimiento) ----------------
  eureka-server:
    build:
      context: ./eureka-server
    image: banco/eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    networks:
      - banco-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------- Config Server ----------------
  config-server:
    build:
      context: ./config-server
    image: banco/config-server:latest
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - banco-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8888/customer-service/default"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------- MongoDB: una instancia por microservicio ----------------
  customer-mongo:
    image: mongo:7
    container_name: customer-mongo
    ports:
      - "27017:27017"
    volumes:
      - customer-mongo-data:/data/db
    networks:
      - banco-net

  account-mongo:
    image: mongo:7
    container_name: account-mongo
    ports:
      - "27018:27017"
    volumes:
      - account-mongo-data:/data/db
    networks:
      - banco-net

  credit-mongo:
    image: mongo:7
    container_name: credit-mongo
    ports:
      - "27019:27017"
    volumes:
      - credit-mongo-data:/data/db
    networks:
      - banco-net

  yanki-mongo:
    image: mongo:7
    container_name: yanki-mongo
    ports:
      - "27020:27017"
    volumes:
      - yanki-mongo-data:/data/db
    networks:
      - banco-net

  # ---------------- Kafka (Fase 12: puente asincrono yanki-service <-> account-service) ----------------
  # Nodo unico en modo KRaft (sin Zookeeper); broker + controller en el mismo proceso.
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - banco-net

  # ---------------- Redis (Fase 14: cache de Customer) ----------------
  customer-redis:
    image: redis:7-alpine
    container_name: customer-redis
    ports:
      - "6379:6379"
    networks:
      - banco-net

  # ---------------- Microservicios de negocio ----------------
  customer-service:
    build:
      context: ./customer-service
    image: banco/customer-service:latest
    container_name: customer-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      customer-mongo:
        condition: service_started
      customer-redis:
        condition: service_started
    networks:
      - banco-net

  account-service:
    build:
      context: ./account-service
    image: banco/account-service:latest
    container_name: account-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      account-mongo:
        condition: service_started
      customer-service:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - banco-net

  credit-service:
    build:
      context: ./credit-service
    image: banco/credit-service:latest
    container_name: credit-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      credit-mongo:
        condition: service_started
      customer-service:
        condition: service_started
    networks:
      - banco-net

  # ---------------- yanki-service (Fase 12, Parte III): monedero movil Yanki ----------------
  # No invoca REST a ningun otro microservicio: toda su integracion con
  # account-service (asociar tarjeta de debito, cargar/retirar saldo) es
  # via los topicos yanki.account.requests/responses en Kafka.
  yanki-service:
    build:
      context: ./yanki-service
    image: banco/yanki-service:latest
    container_name: yanki-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      yanki-mongo:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - banco-net

  # ---------------- API Gateway (punto de entrada unico) ----------------
  api-gateway:
    build:
      context: ./api-gateway
    image: banco/api-gateway:latest
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      customer-service:
        condition: service_started
      account-service:
        condition: service_started
      credit-service:
        condition: service_started
      yanki-service:
        condition: service_started
    networks:
      - banco-net

networks:
  banco-net:
    driver: bridge

volumes:
  customer-mongo-data:
  account-mongo-data:
  credit-mongo-data:
  yanki-mongo-data:
