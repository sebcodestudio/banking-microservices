server:
  port: 8080

# Fase 13: mismo secreto que customer-service, usado solo para validar la
# firma/expiracion del JWT en las rutas protegidas (el gateway no emite tokens).
jwt:
  secret: "banco-parte3-jwt-secret-compartido-entre-customer-service-y-api-gateway-cambiar-en-produccion"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
